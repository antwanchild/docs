name: Recover Missing Site Builds

on:
  workflow_run:
    workflows: [Dependabot, Validate Sites]
    types: [completed]
  # GITHUB_TOKEN merges can suppress push/PR events. Reconcile main even when
  # the merge happens after the PR workflows have already completed.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-site-builds
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch missing builds for main
        uses: actions/github-script@v9
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            const sha = branch.commit.sha;
            const sharedPaths = new Set([
              '.dockerignore', 'requirements.shared.txt', 'mkdocs_env.py',
              '.github/workflows/build-site.yml',
            ]);
            for (const site of ['wiki', 'blog']) {
              const workflow_id = `${site}.yml`;
              const recentRuns = async (head_sha) => {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...repo, workflow_id, branch: 'main', head_sha, per_page: 30,
                });
                return data.workflow_runs.filter(run => ['push', 'workflow_dispatch'].includes(run.event));
              };

              // Include failed and in-progress runs to avoid retrying or duplicating them.
              if ((await recentRuns(sha)).length) {
                core.info(`${workflow_id}: a build already exists for ${sha}`);
                continue;
              }

              const [previous] = await recentRuns();
              if (previous) {
                let comparison;
                try {
                  ({ data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                    ...repo, basehead: `${previous.head_sha}...${sha}`,
                  }));
                } catch (error) {
                  if (error.status !== 404) throw error;
                  core.warning(`${workflow_id}: previous revision is unavailable; rebuilding`);
                }
                const files = comparison?.files ?? [];
                const sitePaths = new Set([
                  `Dockerfile.${site}`, `requirements.${site}.txt`, `nginx-${site}.conf`,
                  `.github/workflows/${workflow_id}`,
                ]);
                const matches = path => path?.startsWith(`${site}/`) ||
                  sharedPaths.has(path) || sitePaths.has(path);
                if (['ahead', 'identical'].includes(comparison?.status) && comparison.files &&
                    files.length < 300 &&
                    !files.some(file => matches(file.filename) || matches(file.previous_filename))) {
                  core.info(`${workflow_id}: no relevant changes since ${previous.head_sha}`);
                  continue;
                }
              }

              await github.rest.actions.createWorkflowDispatch({ ...repo, workflow_id, ref: 'main' });
              core.info(`${workflow_id}: dispatched missing main build (observed ${sha})`);
            }
