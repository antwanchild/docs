name: Action Lint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test wiki release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
