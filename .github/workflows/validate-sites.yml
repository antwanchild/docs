name: Validate Sites

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-sites:
    name: Detect Changed Sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine sites to validate
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'sites=["wiki","blog"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only", f'{os.environ["BASE_SHA"]}...{os.environ["GITHUB_SHA"]}'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          sites = set()
          for path in changed:
              if path.startswith("wiki/"):
                  sites.add("wiki")
              elif path.startswith("blog/"):
                  sites.add("blog")
              else:
                  sites.update(("wiki", "blog"))

          print(f"sites={json.dumps(sorted(sites))}")
          PY

  tests:
    name: Site Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            requirements.shared.txt
      - name: Install test dependencies
        run: pip install -r requirements.test.txt
      - name: Lint test code
        run: python -m pylint --persistent=n --source-roots=. --ignore-patterns='^\._' tests
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run macro and browser tests
        run: python -m pytest
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-test-failures
          path: test-results/
          if-no-files-found: ignore

  workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  sites:
    name: Validate ${{ matrix.site }}
    runs-on: ubuntu-latest
    needs: changed-sites
    if: needs.changed-sites.outputs.sites != '[]'
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changed-sites.outputs.sites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.${{ matrix.site }}.txt
            requirements.shared.txt
      - name: Install dependencies
        run: pip install -r requirements.${{ matrix.site }}.txt
      - name: Build site
        run: zensical build --strict -f ${{ matrix.site }}/zensical.toml
      - name: Verify generated features
        env:
          SITE: ${{ matrix.site }}
        run: |
          if [ "$SITE" = wiki ]; then
            test -s wiki/site/llms.txt
            test -s wiki/site/llms-full.txt
          else
            find blog/site -type f \( -iname '*rss*.xml' -o -iname '*feed*.xml' \) -print -quit | grep -q .
            find blog/site -type f \( -iname '*feed*.json' -o -iname '*rss*.json' \) -print -quit | grep -q .
            find blog/site -type f -path '*/assets/images/social/*' -print -quit | grep -q .
          fi
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        continue-on-error: true
        with:
          globs: |
            ${{ matrix.site }}/docs/**/*.md
      - name: Build container
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.${{ matrix.site }} -t docs-${{ matrix.site }}:validation .
      - name: Verify nginx serving and health check
        env:
          SITE: ${{ matrix.site }}
        run: |
          docker run -d --name docs-validation -p 8080:80 "docs-${SITE}:validation"
          trap 'docker logs docs-validation; docker rm -f docs-validation' EXIT
          for attempt in {1..30}; do
            echo "Waiting for nginx (attempt ${attempt})"
            if curl -fsS http://localhost:8080/ > /tmp/site-home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<html' /tmp/site-home.html
          curl -fsS http://localhost:8080/version.json | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha'
          curl -fsSI http://localhost:8080/version.json | grep -iq 'cache-control: no-store'
          docker exec docs-validation nginx -t
          docker exec docs-validation sh -c 'curl -f http://localhost/ >/dev/null'
          status=$(curl -sS -o /tmp/site-404.html -w '%{http_code}' http://localhost:8080/validation-missing-page)
          test "$status" = 404
          grep -q "This is not the page you're looking for." /tmp/site-404.html
          curl -fsS http://localhost:8080/search.json > /dev/null
          curl -fsS http://localhost:8080/javascripts/open-in-new-tab.js > /dev/null
          if [ "$SITE" = wiki ]; then
            for asset in css/plex-token.css javascripts/plex-token.js; do
              curl -fsS "http://localhost:8080/${asset}" > /dev/null
              curl -fsSI "http://localhost:8080/${asset}" | grep -iq 'cache-control: no-cache'
            done
          fi
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --base-url 'https://${{ matrix.site }}.anthonychild.com'
            './${{ matrix.site }}/site/**/*.html'
          fail: true
          output: link-check-${{ matrix.site }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload link results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: links-${{ matrix.site }}
          path: link-check-${{ matrix.site }}.md
          if-no-files-found: ignore
