name: Build Site

on:
  workflow_call:
    inputs:
      site_name:
        description: 'Human-readable site name (Wiki or Blog)'
        type: string
        required: true
      content_dir:
        description: 'Directory containing site content'
        type: string
        required: true
      project_dir:
        description: 'Directory containing zensical.toml (wiki or blog)'
        type: string
        required: true
      env_file_path:
        description: 'Path to write the .env for the macros plugin'
        type: string
        required: true
      requirements_file:
        description: 'Python requirements file used for site-specific local build steps'
        type: string
        required: true
      image_name:
        description: 'GHCR image name (wiki or blog)'
        type: string
        required: true
      dockerfile:
        description: 'Dockerfile to build from'
        type: string
        required: true
      docker_description:
        description: 'OCI image description label'
        type: string
        required: true
      tag_prefix:
        description: 'Git release tag prefix (wiki- or blog-)'
        type: string
        required: true
      base_url:
        description: 'Base URL passed to lychee for link checking'
        type: string
        required: true
      force_release:
        description: 'Fail if the current monthly changelog section is missing or empty'
        type: boolean
        required: false
        default: false
    secrets:
      ENV_FILE:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true

env:
  TZ: America/Denver

jobs:

  # ---------------------------------------------------------------
  # Lint all Markdown files in the site directory.
  # Runs as informational only — does not block the pipeline.
  # ---------------------------------------------------------------
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.lint.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Markdown files
        id: lint
        uses: DavidAnson/markdownlint-cli2-action@v25.1.0
        continue-on-error: true
        with:
          globs: |
            ${{ inputs.project_dir }}/**/*.md
            !node_modules

  # ---------------------------------------------------------------
  # Spellcheck only the Markdown files changed in this push.
  # Results are uploaded as an artifact for review.
  # Runs as informational only — does not block the pipeline.
  # ---------------------------------------------------------------
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.spellcheck.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            ${{ inputs.project_dir }}/**/*.md

      - name: Run spellcheck on changed files
        id: spellcheck
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: rojopolis/spellcheck-github-actions@0.69.0
        with:
          source_files: ${{ steps.changed-files.outputs.all_changed_files }}
          output_file: spellcheck-results.txt
        continue-on-error: true

      - name: Extract misspelled words from results
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f spellcheck-results.txt ]; then
            awk '/^-{80,}$/ {getline; if (NF > 0) print tolower($0)}' spellcheck-results.txt \
              | sort -u > misspelled-words.txt || true
            if [ -s misspelled-words.txt ]; then
              echo "Misspelled words found:"
              cat misspelled-words.txt
            fi
          fi

      - name: Upload spellcheck results as artifact
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_name }}-spellcheck-results
          path: |
            spellcheck-results.txt
            misspelled-words.txt
          retention-days: 7
          if-no-files-found: ignore

  # Choose the release version before building without changing the source revision.
  plan-release:
    name: Plan Release
    runs-on: ubuntu-latest
    needs: [link-check]
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release-check.outputs.should_release }}
      tag: ${{ steps.release-check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read curated notes and determine release eligibility
        id: release-check
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FORCE_RELEASE: ${{ inputs.force_release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PROJECT_DIR" = "wiki" ]; then
            # A newer main revision has its own queued build; let it release instead.
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python3 .github/scripts/wiki_release.py auto >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE_TAG="${TAG_PREFIX}$(date +%Y.%m)"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export RELEASE_TAG
          python3 - <<'PYTHON'
          import datetime
          import os
          from pathlib import Path
          import re

          changelog = Path(os.environ["PROJECT_DIR"]) / "CHANGELOG.md"
          tag = os.environ["RELEASE_TAG"]
          text = changelog.read_text(encoding="utf-8")
          sections = list(re.finditer(r"^## +(.+)$", text, re.MULTILINE))
          notes = ""
          matches = 0
          for index, section in enumerate(sections):
              if not section.group(1).startswith(f"[{tag}]"):
                  continue
              matches += 1
              heading = re.fullmatch(r"\[" + re.escape(tag) + r"\] - (\d{4}-\d{2}-\d{2})", section.group(1))
              if heading is None:
                  raise SystemExit(f"Expected ## [{tag}] - YYYY-MM-DD")
              datetime.date.fromisoformat(heading.group(1))
              end = sections[index + 1].start() if index + 1 < len(sections) else len(text)
              notes = text[section.end():end].strip()
          if matches > 1:
              raise SystemExit(f"Duplicate changelog sections for {tag}")
          has_entries = bool(re.search(r"^- +\S", notes, re.MULTILINE))
          if not has_entries and os.environ["FORCE_RELEASE"] == "true":
              raise SystemExit(f"Add a nonempty dated section for {tag} in {changelog}")
          if has_entries:
              Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          else:
              print(f"No curated notes for {tag} — skipping release")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_release={str(has_entries).lower()}\n")
              output.write(f"tag={tag}\n")
          PYTHON

      - name: Stage release notes and changelog
        if: steps.release-check.outputs.should_release == 'true'
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          mkdir release-plan
          mv release-notes.md release-plan/
          if [ "$PROJECT_DIR" = "wiki" ]; then
            cp wiki/CHANGELOG.md release-plan/wiki-changelog.md
          fi

      - name: Upload release plan
        if: steps.release-check.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ inputs.image_name }}-release-plan
          path: release-plan/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # ---------------------------------------------------------------
  # Build and push the Docker image to GHCR.
  # Determines the version tag based on whether new pages were added.
  # Scans the built image for known CVEs using Trivy.
  # Publish only after the strict build, link check and image scan pass.
  # ---------------------------------------------------------------
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck, link-check, plan-release]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_tag: ${{ steps.version.outputs.build_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version tag
        id: version
        env:
          RELEASE_VERSION: ${{ needs.plan-release.outputs.should_release == 'true' && needs.plan-release.outputs.tag || '' }}
        run: |
          git fetch --tags --force

          NEW_PAGES="$(git diff --name-status HEAD~1 HEAD -- '${{ inputs.content_dir }}' | grep '^A' | grep '\.md$' || true)"

          if [ -n "$NEW_PAGES" ]; then
            IMAGE_VERSION="$(date +%Y.%m.%d)"
          else
            IMAGE_VERSION="$(git tag --list | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1)"
            if [ -z "$IMAGE_VERSION" ]; then
              IMAGE_VERSION="$(date +%Y.%m.%d)"
            fi
          fi

          IMAGE_VERSION_YEAR_MONTH="$(echo "$IMAGE_VERSION" | cut -d. -f1-2)"
          IMAGE_VERSION_YEAR="$(echo "$IMAGE_VERSION" | cut -d. -f1)"

          {
            echo "version=${IMAGE_VERSION}"
            echo "image_label=${RELEASE_VERSION:-$IMAGE_VERSION}"
            echo "build_tag=sha-${GITHUB_SHA:0:7}"
            echo "year_month=${IMAGE_VERSION_YEAR_MONTH}"
            echo "year=${IMAGE_VERSION_YEAR}"
          } >> "$GITHUB_OUTPUT"

          echo "Image version: ${IMAGE_VERSION}"

      - name: Generate Docker image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.year_month }}
            type=raw,value=${{ steps.version.outputs.year }}
            type=raw,value=${{ steps.version.outputs.build_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=Anthony Child
            org.opencontainers.image.source=https://github.com/antwanchild/docs
            org.opencontainers.image.url=https://${{ inputs.image_name }}.anthonychild.com
            org.opencontainers.image.documentation=https://${{ inputs.image_name }}.anthonychild.com
            org.opencontainers.image.vendor=Anthony Child
            org.opencontainers.image.title=${{ inputs.site_name }}
            org.opencontainers.image.description=${{ inputs.docker_description }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_label }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Refresh Alpine packages before Trivy scans the image.
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            env_file=${{ secrets.ENV_FILE }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Scan image for CVEs with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Verify the built image revision and HTTP endpoints
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.version.outputs.image_label }}
        run: |
          IMAGE_VERSION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")"
          if [ "$IMAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Built image version $IMAGE_VERSION does not match $EXPECTED_VERSION." >&2
            exit 1
          fi
          docker run -d --name site-validation -p 8080:80 "$IMAGE"
          trap 'docker logs site-validation; docker rm -f site-validation' EXIT
          for attempt in {1..30}; do
            echo "Waiting for local site (${attempt}/30)"
            if curl -fsS http://localhost:8080/ > /tmp/site-home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<html' /tmp/site-home.html
          curl -fsS http://localhost:8080/search.json > /dev/null
          curl -fsS http://localhost:8080/version.json | jq -e --arg sha "$EXPECTED_SHA" '.revision == $sha'

      - name: Publish the scanned image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # ---------------------------------------------------------------
  # Automatically prepare wiki notes; publish the current dated blog month.
  # Uses monthly tags (PREFIX-YYYY.MM) and a rolling yearly tag (PREFIX-YYYY).
  # Wiki Unreleased entries are archived after a successful image build.
  # Wiki supports multiple releases per month; existing tags are skipped.
  # ---------------------------------------------------------------
  version:
    name: Version and Release
    runs-on: ubuntu-latest
    needs: [docker, plan-release]
    permissions:
      contents: write
      packages: write
    outputs:
      should_release: ${{ needs.plan-release.outputs.should_release }}
      tag: ${{ needs.plan-release.outputs.tag }}
      release_notes: ${{ steps.create-release.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release plan
        if: needs.plan-release.outputs.should_release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.image_name }}-release-plan
          path: release-plan

      - name: Authenticate with GitHub Container Registry
        if: needs.plan-release.outputs.should_release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the matching release image tag
        if: needs.plan-release.outputs.should_release == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          BUILD_TAG: ${{ needs.docker.outputs.build_tag }}
          RELEASE_TAG: ${{ needs.plan-release.outputs.tag }}
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          if [ "$PROJECT_DIR" = "wiki" ]; then
            MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
              echo "Main advanced while building. Its queued build will prepare the release."
              exit 1
            fi
          fi
          docker pull "$IMAGE:$BUILD_TAG"
          REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$BUILD_TAG")"
          if [ "$REVISION" != "$GITHUB_SHA" ]; then
            echo "Published image revision $REVISION does not match $GITHUB_SHA." >&2
            exit 1
          fi
          VERSION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:$BUILD_TAG")"
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "Published image version $VERSION does not match $RELEASE_TAG." >&2
            exit 1
          fi
          docker tag "$IMAGE:$BUILD_TAG" "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"

      - name: Create version and yearly release tags
        id: create-release
        if: needs.plan-release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          RELEASE_TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          YEARLY_TAG="${RELEASE_TAG%%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$PROJECT_DIR" = "wiki" ]; then
            cp release-plan/wiki-changelog.md wiki/CHANGELOG.md
          fi
          if ! git diff --quiet -- wiki/CHANGELOG.md; then
            git add wiki/CHANGELOG.md
            git commit -m "docs: archive ${RELEASE_TAG} changelog"
            # Fast-forward only: never overwrite a concurrent change to main.
            # If main advanced, its queued build will prepare the release instead.
            if ! git push origin HEAD:refs/heads/main; then
              echo 'Main advanced or disallows bot commits; release was not published.' >&2
              exit 1
            fi
          fi

          # The release describes the revision whose image passed all build checks.
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

          git tag -f "$YEARLY_TAG"
          git push origin "$YEARLY_TAG" --force

          RELEASE_NOTES="$(cat release-plan/release-notes.md)"

          {
            DELIMITER="notes_$(cat /proc/sys/kernel/random/uuid)"
            echo "release_notes<<${DELIMITER}"
            echo "$RELEASE_NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" \
            --title "${RELEASE_TAG}" \
            --notes-file release-plan/release-notes.md \
            --latest

  # ---------------------------------------------------------------
  # Build the Zensical site locally and check all links for broken URLs.
  # Common excludes live in lychee.toml; site-specific base URL is an input.
  # Gates image publication so failed builds or links cannot update latest.
  # ---------------------------------------------------------------
  link-check:
    name: Link Checker
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck]
    outputs:
      build_error: ${{ steps.zensical.outputs.error }}
      links_outcome: ${{ steps.lychee.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            ${{ inputs.requirements_file }}
            requirements.shared.txt

      - name: Install Python dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        run: uv pip install -r "$REQUIREMENTS_FILE"

      - name: Write .env file for site macros
        run: echo "${{ secrets.ENV_FILE }}" > ${{ inputs.env_file_path }}

      - name: Build Zensical site
        id: zensical
        shell: bash
        working-directory: ${{ inputs.project_dir }}
        run: |
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          if zensical build --strict 2>&1 | tee "$build_log"; then
            exit 0
          else
            build_status=$?
          fi

          # Share only known exception names because build logs can contain macro values.
          error="$(sed -nE 's/^([[:alnum:]_.]+\.)?(TemplateSyntaxError|TemplateNotFound|UndefinedError|TOMLDecodeError|ModuleNotFoundError|ImportError|AttributeError|FileNotFoundError|TypeError|ValueError):.*/\2/p' "$build_log" | tail -n 1)"
          echo "error=${error:-Strict build failed. See the Zensical step log.}" >> "$GITHUB_OUTPUT"
          exit "$build_status"

      - name: Check all links in built site
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --base-url '${{ inputs.base_url }}'
            './${{ inputs.project_dir }}/site/**/*.html'
          fail: true
          output: link-check-results.md
          format: markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter out successful links from results
        if: failure()
        run: grep -v '\[200\]' link-check-results.md > link-check-filtered.md || true

      - name: Upload failed link check results as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_name }}-link-check-results
          path: link-check-filtered.md
          retention-days: 7

      - name: Remove .env file
        if: always()
        run: rm -f ${{ inputs.env_file_path }}

  # ---------------------------------------------------------------
  # Send a Discord embed when a release is created.
  # ---------------------------------------------------------------
  notify-release:
    name: Discord Release Notification
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: ${{ inputs.site_name }}
          event: Release
          result: success
          sha: ${{ github.sha }}
          version: ${{ needs.version.outputs.tag }}
          details: ${{ needs.version.outputs.release_notes }}
          release-url: ${{ format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, needs.version.outputs.tag) }}

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck, docker, version, link-check, plan-release]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Summarize build results
        id: summary
        shell: bash
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          PACKAGE: ${{ inputs.image_name }}
          RELEASE_RESULT: ${{ needs.version.result }}
          RELEASE_TAG: ${{ needs.version.outputs.should_release == 'true' && needs.version.outputs.tag || '' }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          PUSH_BEFORE: ${{ github.event.before }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          MARKDOWN_OUTCOME: ${{ needs.markdownlint.outputs.outcome }}
          SPELLCHECK_OUTCOME: ${{ needs.spellcheck.outputs.outcome }}
          BUILD_ERROR: ${{ needs.link-check.outputs.build_error }}
          LINKS_OUTCOME: ${{ needs.link-check.outputs.links_outcome }}
        run: |
          changes=''
          if [[ "$DOCKER_RESULT" == 'success' ]]; then
            if [[ "$RELEASE_RESULT" == 'success' && -n "$RELEASE_TAG" && -n "$RELEASE_NOTES" ]]; then
              changes="$RELEASE_NOTES"
            elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
              changes='Manual rebuild of the selected revision.'
            elif [[ -n "$PUSH_BEFORE" ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              changes="$(git log --no-merges -3 --format='- %s' "$PUSH_BEFORE..$GITHUB_SHA" -- \
                "$PROJECT_DIR/" "$DOCKERFILE" "$REQUIREMENTS_FILE" "nginx-${PROJECT_DIR}.conf" \
                ".github/workflows/${PROJECT_DIR}.yml" .github/workflows/build-site.yml \
                .dockerignore requirements.shared.txt mkdocs_env.py)"
            fi
            # Use the built revision when the push base or a scoped subject is unavailable.
            if [[ -z "$changes" ]]; then
              changes="$(git show -s --format='%s' "$GITHUB_SHA")"
            fi
          fi

          delimiter="$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'details<<%s\n' "$delimiter"
            if [[ "$DOCKER_RESULT" == 'success' ]]; then
              echo 'Checks passed: strict Zensical build, link check, Trivy scan, and image smoke test.'
              printf 'Published image: [%s:latest](%s/%s/pkgs/container/%s)\n' "$IMAGE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY_OWNER" "$PACKAGE"
              printf 'Live site: pull the image on the server, then run [Verify Published Sites](%s/%s/actions/workflows/verify-published-sites.yml).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            else
              printf 'Image publication: %s\n' "$DOCKER_RESULT"
            fi

            if [[ "$RELEASE_RESULT" == 'success' ]]; then
              if [[ -n "$RELEASE_TAG" ]]; then
                printf 'Release: [%s](%s/%s/releases/tag/%s)\n' "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG"
              else
                echo 'Release: no new release for this build.'
              fi
            fi

            if [[ -n "$BUILD_ERROR" ]]; then
              printf 'Zensical error: %s\n' "$BUILD_ERROR"
            fi
            if [[ "$LINKS_OUTCOME" == 'failure' ]]; then
              echo 'Link check failed. See the link-check results artifact when available.'
            fi
            if [[ "$MARKDOWN_OUTCOME" == 'failure' ]]; then
              echo 'Warning: Markdown lint reported issues. See its job log.'
            fi
            if [[ "$SPELLCHECK_OUTCOME" == 'failure' ]]; then
              echo 'Warning: spellcheck reported issues. See its results artifact or job log.'
            fi
            if [[ -n "$changes" ]]; then
              # Leave room for the build status and warnings in Discord's Details field.
              printf '\n**What changed**\n%s\n' "${changes:0:420}"
            fi
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: ${{ inputs.site_name }}
          event: Build
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          sha: ${{ github.sha }}
          version: ${{ needs.version.result == 'success' && needs.version.outputs.should_release == 'true'
            && needs.version.outputs.tag || needs.docker.outputs.version }}
          details: ${{ steps.summary.outputs.details }}
