name: Build Site

on:
  workflow_call:
    inputs:
      site_name:
        description: 'Human-readable site name (Wiki or Blog)'
        type: string
        required: true
      site_emoji:
        description: 'Emoji used in Discord release notifications'
        type: string
        required: true
      content_dir:
        description: 'Path checked for new .md files to trigger a release'
        type: string
        required: true
      project_dir:
        description: 'Directory containing zensical.toml (wiki or blog)'
        type: string
        required: true
      env_file_path:
        description: 'Path to write the .env for the macros plugin'
        type: string
        required: true
      requirements_file:
        description: 'Python requirements file used for site-specific local build steps'
        type: string
        required: true
      image_name:
        description: 'GHCR image name (wiki or blog)'
        type: string
        required: true
      dockerfile:
        description: 'Dockerfile to build from'
        type: string
        required: true
      docker_description:
        description: 'OCI image description label'
        type: string
        required: true
      tag_prefix:
        description: 'Git release tag prefix (wiki- or blog-)'
        type: string
        required: true
      base_url:
        description: 'Base URL passed to lychee for link checking'
        type: string
        required: true
      force_release:
        description: 'Force a release even if no new pages were added'
        type: boolean
        required: false
        default: false
    secrets:
      ENV_FILE:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true

env:
  TZ: America/Denver

jobs:

  # ---------------------------------------------------------------
  # Lint all Markdown files in the site directory.
  # Runs as informational only — does not block the pipeline.
  # ---------------------------------------------------------------
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        continue-on-error: true
        with:
          globs: |
            ${{ inputs.project_dir }}/**/*.md
            !node_modules

  # ---------------------------------------------------------------
  # Spellcheck only the Markdown files changed in this push.
  # Results are uploaded as an artifact for review.
  # Runs as informational only — does not block the pipeline.
  # ---------------------------------------------------------------
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            ${{ inputs.project_dir }}/**/*.md

      - name: Run spellcheck on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: rojopolis/spellcheck-github-actions@0.69.0
        with:
          source_files: ${{ steps.changed-files.outputs.all_changed_files }}
          output_file: spellcheck-results.txt
        continue-on-error: true

      - name: Extract misspelled words from results
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f spellcheck-results.txt ]; then
            awk '/^-{80,}$/ {getline; if (NF > 0) print tolower($0)}' spellcheck-results.txt \
              | sort -u > misspelled-words.txt || true
            if [ -s misspelled-words.txt ]; then
              echo "Misspelled words found:"
              cat misspelled-words.txt
            fi
          fi

      - name: Upload spellcheck results as artifact
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_name }}-spellcheck-results
          path: |
            spellcheck-results.txt
            misspelled-words.txt
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Build and push the Docker image to GHCR.
  # Determines the version tag based on whether new pages were added.
  # Scans the built image for known CVEs using Trivy.
  # Publish only after the strict build, link check and image scan pass.
  # ---------------------------------------------------------------
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck, link-check]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version tag
        id: version
        run: |
          git fetch --tags --force

          NEW_PAGES="$(git diff --name-status HEAD~1 HEAD -- '${{ inputs.content_dir }}' | grep '^A' | grep '\.md$' || true)"

          if [ -n "$NEW_PAGES" ]; then
            IMAGE_VERSION="$(date +%Y.%m.%d)"
          else
            IMAGE_VERSION="$(git tag --list | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1)"
            if [ -z "$IMAGE_VERSION" ]; then
              IMAGE_VERSION="$(date +%Y.%m.%d)"
            fi
          fi

          IMAGE_VERSION_YEAR_MONTH="$(echo "$IMAGE_VERSION" | cut -d. -f1-2)"
          IMAGE_VERSION_YEAR="$(echo "$IMAGE_VERSION" | cut -d. -f1)"

          {
            echo "version=${IMAGE_VERSION}"
            echo "year_month=${IMAGE_VERSION_YEAR_MONTH}"
            echo "year=${IMAGE_VERSION_YEAR}"
          } >> "$GITHUB_OUTPUT"

          echo "Image version: ${IMAGE_VERSION}"

      - name: Generate Docker image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.year_month }}
            type=raw,value=${{ steps.version.outputs.year }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=Anthony Child
            org.opencontainers.image.source=https://github.com/antwanchild/docs
            org.opencontainers.image.url=https://${{ inputs.image_name }}.anthonychild.com
            org.opencontainers.image.documentation=https://${{ inputs.image_name }}.anthonychild.com
            org.opencontainers.image.vendor=Anthony Child
            org.opencontainers.image.title=${{ inputs.site_name }}
            org.opencontainers.image.description=${{ inputs.docker_description }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            env_file=${{ secrets.ENV_FILE }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Scan image for CVEs with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Verify the built image revision and HTTP endpoints
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          docker run -d --name site-validation -p 8080:80 "$IMAGE"
          trap 'docker logs site-validation; docker rm -f site-validation' EXIT
          for attempt in {1..30}; do
            echo "Waiting for local site (${attempt}/30)"
            if curl -fsS http://localhost:8080/ > /tmp/site-home.html; then
              break
            fi
            sleep 1
          done
          grep -q '<html' /tmp/site-home.html
          curl -fsS http://localhost:8080/search.json > /dev/null
          curl -fsS http://localhost:8080/version.json | jq -e --arg sha "$EXPECTED_SHA" '.revision == $sha'

      - name: Publish the scanned image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # ---------------------------------------------------------------
  # Create a GitHub release when new pages are added.
  # Uses monthly tags (PREFIX-YYYY.MM) and a rolling yearly tag (PREFIX-YYYY).
  # Release notes are generated by git-cliff, scoped to the site directory.
  # Skips if no new pages were added or if the monthly tag already exists.
  # ---------------------------------------------------------------
  version:
    name: Version and Release
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.release-check.outputs.should_release }}
      tag: ${{ steps.release-check.outputs.tag }}
      release_notes: ${{ steps.create-release.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new pages and determine release eligibility
        id: release-check
        run: |
          git fetch --tags --force

          RELEASE_MONTH=$(date +%m)
          RELEASE_YEAR=$(date +%Y)
          RELEASE_TAG="${{ inputs.tag_prefix }}${RELEASE_YEAR}.${RELEASE_MONTH}"

          if [[ "${{ inputs.force_release }}" == "true" ]]; then
            echo "Force release triggered manually"
            if git tag --list | grep -q "^${RELEASE_TAG}$"; then
              echo "Release tag ${RELEASE_TAG} already exists — skipping release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          NEW_PAGES=$(git diff --name-status HEAD~1 HEAD -- '${{ inputs.content_dir }}' | grep '^A' | grep '\.md$' || true)

          if [ -z "$NEW_PAGES" ]; then
            echo "No new pages added — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag --list | grep -q "^${RELEASE_TAG}$"; then
            echo "Release tag ${RELEASE_TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release note range
        id: range
        if: steps.release-check.outputs.should_release == 'true'
        run: |
          PREV_TAG=$(git tag --list "${{ inputs.tag_prefix }}*" | sort -V | tail -1)
          if [ -n "$PREV_TAG" ]; then
            echo "value=${PREV_TAG}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD~20..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes with git-cliff
        id: cliff
        if: steps.release-check.outputs.should_release == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --tag ${{ steps.release-check.outputs.tag }}
            --include-path ${{ inputs.project_dir }}/**
            ${{ steps.range.outputs.value }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
        continue-on-error: true

      - name: Create monthly and yearly release tags
        id: create-release
        if: steps.release-check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release-check.outputs.tag }}"
          YEARLY_TAG="${{ inputs.tag_prefix }}$(date +%Y)"
          RANGE="${{ steps.range.outputs.value }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -s release-notes.md ]; then
            git log --pretty=format:"- %s" "$RANGE" -- "${{ inputs.project_dir }}/" > release-notes.md || true
          fi
          if [ ! -s release-notes.md ]; then
            echo "- ${{ inputs.site_name }} update" > release-notes.md
          fi

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          git tag -f "$YEARLY_TAG"
          git push origin "$YEARLY_TAG" --force

          RELEASE_NOTES="$(cat release-notes.md)"

          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --latest

  # ---------------------------------------------------------------
  # Build the Zensical site locally and check all links for broken URLs.
  # Common excludes live in lychee.toml; site-specific base URL is an input.
  # Gates image publication so failed builds or links cannot update latest.
  # ---------------------------------------------------------------
  link-check:
    name: Link Checker
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r ${{ inputs.requirements_file }}

      - name: Write .env file for site macros
        run: echo "${{ secrets.ENV_FILE }}" > ${{ inputs.env_file_path }}

      - name: Build Zensical site
        run: |
          cd ${{ inputs.project_dir }}
          zensical build --strict

      - name: Check all links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --base-url '${{ inputs.base_url }}'
            './${{ inputs.project_dir }}/site/**/*.html'
          fail: true
          output: link-check-results.md
          format: markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter out successful links from results
        if: failure()
        run: grep -v '\[200\]' link-check-results.md > link-check-filtered.md || true

      - name: Upload failed link check results as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_name }}-link-check-results
          path: link-check-filtered.md
          retention-days: 7

      - name: Remove .env file
        if: always()
        run: rm -f ${{ inputs.env_file_path }}

  verify-live:
    name: Verify Published Site
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 12
    steps:
      - name: Wait for the public site to serve this revision
        env:
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 5 \
              -H 'Cache-Control: no-cache' "${BASE_URL}/version.json?revision=${EXPECTED_SHA}" \
              | jq -e --arg sha "$EXPECTED_SHA" '.revision == $sha' > /dev/null; then
              curl --fail --silent --show-error --max-time 30 "$BASE_URL/" > /tmp/live-site.html
              grep -q '<html' /tmp/live-site.html
              echo "Verified ${BASE_URL} at ${EXPECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for deployment (${attempt}/20)"
            sleep 25
          done
          echo "Image published, but ${BASE_URL} did not serve ${EXPECTED_SHA} within 10 minutes. Update the hosting container to the new image and rerun this job." >&2
          exit 1

  # ---------------------------------------------------------------
  # Send a Discord embed when a release is created.
  # ---------------------------------------------------------------
  notify-release:
    name: Discord Release Notification
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.should_release == 'true'
    steps:
      - name: Send release notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SITE_NAME: ${{ inputs.site_name }}
          SITE_EMOJI: ${{ inputs.site_emoji }}
        run: |
          FORMATTED_DATE="$(date +'%B %-d, %Y at %-I:%M %p %Z')"

          jq -n \
            --arg title "${SITE_EMOJI} ${SITE_NAME} — Release Published" \
            --arg url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg notes "${RELEASE_NOTES:-No release notes provided.}" \
            --arg footer "${SITE_NAME} ${RELEASE_TAG} • github.com/${REPOSITORY} • ${FORMATTED_DATE}" \
            '{embeds: [{title: $title, url: $url, color: 3066993,
              fields: [
                {name: "🏷️ Release", value: $tag, inline: true},
                {name: "📝 Changes", value: $notes[0:1024], inline: false},
                {name: "🔗 Link", value: ("[View on GitHub](" + $url + ")"), inline: true}
              ], footer: {text: $footer}}]}' \
            | curl --fail-with-body -sS -H 'Content-Type: application/json' --data-binary @- "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------
  # Send a Discord embed notification with the overall build result
  # and individual job statuses for each stage of the pipeline.
  # Always runs regardless of upstream job results.
  # ---------------------------------------------------------------
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [markdownlint, spellcheck, docker, version, link-check, verify-live]
    if: always()
    steps:
      - name: Send build result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPOSITORY: ${{ github.repository }}
          SITE_NAME: ${{ inputs.site_name }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DOCKER_VERSION: ${{ needs.docker.outputs.version }}
          GITHUB_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKDOWNLINT_RESULT: ${{ needs.markdownlint.result }}
          SPELLCHECK_RESULT: ${{ needs.spellcheck.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          LINKCHECK_RESULT: ${{ needs.link-check.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
          HAS_FAILURES: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          FORMATTED_DATE="$(date +'%B %-d, %Y at %-I:%M %p %Z')"

          if [[ "${HAS_FAILURES}" == "true" ]]; then
            EMBED_TITLE="❌ ${SITE_NAME} — Build Failed"
            EMBED_COLOR=15158332
          else
            EMBED_TITLE="✅ ${SITE_NAME} — Build Succeeded"
            EMBED_COLOR=3066993
          fi

          job_status_label() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⚠️ Skipped" ;;
              cancelled) echo "⚠️ Cancelled" ;;
              *)       echo "❓ Unknown" ;;
            esac
          }

          LINT_STATUS=$(job_status_label "${MARKDOWNLINT_RESULT}")
          SPELL_STATUS=$(job_status_label "${SPELLCHECK_RESULT}")
          DOCKER_STATUS=$(job_status_label "${DOCKER_RESULT}")
          LINK_STATUS=$(job_status_label "${LINKCHECK_RESULT}")

          jq -n \
            --arg title "$EMBED_TITLE" \
            --argjson color "$EMBED_COLOR" \
            --arg actor "$GITHUB_ACTOR_NAME" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg version "${DOCKER_VERSION:-unpublished}" \
            --arg lint "$LINT_STATUS" --arg spell "$SPELL_STATUS" \
            --arg docker "$DOCKER_STATUS" --arg links "$LINK_STATUS" \
            --arg live "$(job_status_label "$LIVE_RESULT")" \
            --arg release "$(job_status_label "$VERSION_RESULT")" \
            --arg commit "[${GITHUB_SHA::7}](${GITHUB_COMMIT_URL}) — ${COMMIT_MESSAGE:-Manual or recovered build}" \
            --arg run "[View Run](${GITHUB_RUN_URL})" \
            --arg footer "${SITE_NAME} • github.com/${REPOSITORY} • ${FORMATTED_DATE}" \
            '{embeds: [{title: $title, color: $color, fields: [
              {name: "👤 Triggered by", value: $actor, inline: true},
              {name: "🌿 Branch", value: $branch, inline: true},
              {name: "🏷️ Version", value: $version, inline: true},
              {name: "📝 Markdown Lint", value: $lint, inline: true},
              {name: "🔤 Spellcheck", value: $spell, inline: true},
              {name: "🐳 Docker Build", value: $docker, inline: true},
              {name: "🔗 Link Checker", value: $links, inline: true},
              {name: "🌐 Published Site", value: $live, inline: true},
              {name: "📦 Release", value: $release, inline: true},
              {name: "💬 Commit", value: $commit[0:1024], inline: false},
              {name: "🔗 Actions", value: $run, inline: false}
            ], footer: {text: $footer}}]}' \
            | curl --fail-with-body -sS -H 'Content-Type: application/json' --data-binary @- "$DISCORD_WEBHOOK_URL"
