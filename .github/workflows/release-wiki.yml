name: Release Wiki

# Optional retry/rebuild entry point; normal wiki pushes release automatically.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-site.yml
    with:
      site_name: Wiki
      content_dir: wiki/docs/
      project_dir: wiki
      env_file_path: wiki/.env
      requirements_file: requirements.wiki.txt
      image_name: wiki
      dockerfile: Dockerfile.wiki
      docker_description: Personal wiki built with Zensical
      tag_prefix: wiki-
      base_url: https://wiki.anthonychild.com
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
