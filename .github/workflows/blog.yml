name: Blog

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'Dockerfile.blog'
      - '.dockerignore'
      - 'requirements.blog.txt'
      - 'requirements.shared.txt'
      - 'mkdocs_env.py'
      - 'nginx-blog.conf'
      - '.github/workflows/build-site.yml'
      - '.github/workflows/blog.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no new posts were added'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-site.yml
    with:
      site_name: Blog
      site_emoji: "✏️"
      content_dir: blog/docs/posts/
      project_dir: blog
      env_file_path: blog/.env
      requirements_file: requirements.blog.txt
      image_name: blog
      dockerfile: Dockerfile.blog
      docker_description: Personal blog built with Zensical
      tag_prefix: blog-
      base_url: https://blog.anthonychild.com
      force_release: ${{ inputs.force_release || false }}
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
