# Zensical site configuration

[project]
site_name = "Anthony's Blog"
site_url = "https://blog.anthonychild.com"
site_description = "Random Thoughts from Me..."
site_author = "Anthony Child"
copyright = "© <script>document.write(new Date().getFullYear())</script> Anthony Child • All rights reserved"
extra_javascript = [
  "javascripts/open-in-new-tab.js",
]

[project.theme]
name = "material"
variant = "modern"
custom_dir = "docs/overrides"
palette = [
  { media = "(prefers-color-scheme)", toggle = { icon = "material/brightness-auto", name = "Switch to light mode" } },
  { media = "(prefers-color-scheme: light)", scheme = "default", primary = "indigo", accent = "deep orange", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
  { media = "(prefers-color-scheme: dark)", scheme = "slate", primary = "deep purple", accent = "amber", toggle = { icon = "material/brightness-4", name = "Switch to system preference" } },
]
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.tabs.link",
  "toc.follow",
]

[project.theme.icon]
logo = "fontawesome/brands/discord"

[project.markdown_extensions]

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.betterem"]
smart_enable = "all"

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.keys"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.smartsymbols"]

[project.markdown_extensions."pymdownx.snippets"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]

[project.plugins]

[project.plugins.search]
lang = "en"
separator = "[\\s\\-,:!=\\[\\]()\"/]+|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;"

[project.plugins.privacy]

[project.plugins.blog]
blog_dir = "."
authors_file = ".authors.yml"
authors_profiles = true
categories = true
categories_url_format = "category/{slug}"

[project.plugins.social]

[project.plugins.rss]
feed_title = "Anthony's Blog"
match_path = "^posts/.*"

[project.plugins.redirects]

[project.plugins.redirects.redirect_maps]

[project.plugins.glightbox]

[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true

[project.plugins.minify.htmlmin_opts]
remove_comments = true

[project.plugins.macros]
on_error_fail = true
on_undefined = "strict"

[project.plugins.tags]
